<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Prerendered for the dark theme; the script below updates it. -->
		<meta name="theme-color" content="#0b0b0c" />
		<script>
			// Applies the saved or system theme before first paint, so the page never
			// flashes the wrong one. Mirrors applyTheme() in src/lib/theme.svelte.ts;
			// the colors are --bg in src/app.css.
			(function () {
				var pref = 'system';
				try {
					var stored = localStorage.getItem('notely-theme');
					if (stored === 'light' || stored === 'dark') pref = stored;
				} catch (e) {}
				var theme =
					pref === 'system'
						? matchMedia('(prefers-color-scheme: light)').matches
							? 'light'
							: 'dark'
						: pref;
				var root = document.documentElement;
				root.dataset.theme = theme;
				root.style.colorScheme = theme;
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', theme === 'light' ? '#ffffff' : '#0b0b0c');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
